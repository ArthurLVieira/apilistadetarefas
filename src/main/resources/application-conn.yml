spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ListaDeTarefas
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      dll-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true