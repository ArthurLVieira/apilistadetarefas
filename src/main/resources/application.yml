server:
  port: ${PORT:8080}

#logging:
#  level:
#    org.springframework.security: DEBUG
#    org.springframework.security.oauth2.client: TRACE

spring:
  config:
    import: optional:file:.env[.properties]
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  application:
    name: apilistadetarefas
  profiles:
    active: conn
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
  password-reset:
    code-expiration-minutes: ${PASSWORD_RESET_CODE_EXPIRATION_MINUTES:10}
  jwt:
    secret: ${JWT_SECRET}
    expiresIn: 86400000
  oauth2:
    redirect-uri: http://localhost:8080/login/oauth2/code/google
